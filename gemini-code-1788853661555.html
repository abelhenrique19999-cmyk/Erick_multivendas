<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <form id="login-form" class="card" style="padding: 2rem; width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Painel de Controle</h2>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        <button type="submit" class="btn-cta" style="width: 100%; border-radius: 8px;">ENTRAR</button>
    </form>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            if (res.ok) window.location.href = '/admin/';
            else alert('E-mail ou senha incorretos.');
        });
    </script>
</body>
</html>
